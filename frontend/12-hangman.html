<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangman</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
        display: flex;
        justify-content: center;
        padding: 1.5rem;
      }

      .game {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: min(28rem, 100%);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .toolbar > :first-child {
        flex: 1;
        min-width: 0;
        margin: 0;
      }

      .stage {
        display: flex;
        align-items: flex-end;
        gap: 1.5rem;
      }

      .gallows {
        position: relative;
        width: 7rem;
        height: 11rem;
        flex: 0 0 auto;
      }

      .gallows span {
        position: absolute;
        background: #111;
      }

      .base {
        left: 0;
        bottom: 0;
        width: 5rem;
        height: 0.25rem;
      }

      .post {
        left: 1.25rem;
        top: 0;
        width: 0.25rem;
        height: 11rem;
      }

      .beam {
        left: 1.25rem;
        top: 0;
        width: 3.5rem;
        height: 0.25rem;
      }

      .rope {
        left: 4.5rem;
        top: 0;
        width: 0.25rem;
        height: 1.5rem;
      }

      .part {
        visibility: hidden;
      }

      .part.on {
        visibility: visible;
      }

      .gallows .head {
        left: 3.6rem;
        top: 1.5rem;
        width: 2rem;
        height: 2rem;
        border: 0.25rem solid #111;
        border-radius: 50%;
        background: transparent;
      }

      .body {
        left: 4.5rem;
        top: 3.5rem;
        width: 0.25rem;
        height: 3rem;
      }

      .arm-l {
        left: 3.1rem;
        top: 4rem;
        width: 1.5rem;
        height: 0.25rem;
        transform: rotate(-30deg);
      }

      .arm-r {
        left: 4.6rem;
        top: 4rem;
        width: 1.5rem;
        height: 0.25rem;
        transform: rotate(30deg);
      }

      .leg-l {
        left: 3.3rem;
        top: 6.2rem;
        width: 1.5rem;
        height: 0.25rem;
        transform: rotate(-40deg);
      }

      .leg-r {
        left: 4.5rem;
        top: 6.2rem;
        width: 1.5rem;
        height: 0.25rem;
        transform: rotate(40deg);
      }

      #word {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.35rem;
        font-family: ui-monospace, monospace;
      }

      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .keys button {
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid #111;
        background: #fff;
        cursor: pointer;
      }

      .keys button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .keys button.hit {
        background: #dff5d8;
      }

      .keys button.miss {
        background: #f5d8d8;
      }

      :focus-visible {
        outline: 2px solid #111;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>Hangman</h1>
      <div class="toolbar">
        <p id="status" aria-live="polite"></p>
        <button type="button" id="reset">New word</button>
      </div>
      <div class="stage">
        <div class="gallows" id="gallows" aria-hidden="true">
          <span class="base"></span>
          <span class="post"></span>
          <span class="beam"></span>
          <span class="rope"></span>
          <span class="head part" data-need="1"></span>
          <span class="body part" data-need="2"></span>
          <span class="arm-l part" data-need="3"></span>
          <span class="arm-r part" data-need="4"></span>
          <span class="leg-l part" data-need="5"></span>
          <span class="leg-r part" data-need="6"></span>
        </div>
        <p id="word"></p>
      </div>
      <div class="keys" id="keys" aria-label="Letters"></div>
    </main>
    <script>
      const WORDS = [
        "PLANET",
        "BRIDGE",
        "CURSOR",
        "KERNEL",
        "WIDGET",
        "HANGAR",
        "ORANGE",
        "SILVER",
        "BUTTON",
        "WINDOW",
      ];
      const MAX_WRONG = 6;
      const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const statusEl = document.getElementById("status");
      const wordEl = document.getElementById("word");
      const gallows = document.getElementById("gallows");
      const keys = document.getElementById("keys");

      const pickWord = (except) => {
        const pool = WORDS.filter((w) => w !== except);
        return pool[Math.floor(Math.random() * pool.length)] || WORDS[0];
      };

      const emptyState = (except) => ({
        word: pickWord(except),
        guessed: [],
      });

      let state = emptyState();

      const wrongLetters = () =>
        state.guessed.filter((ch) => !state.word.includes(ch));

      const masked = () =>
        [...state.word]
          .map((ch) => (state.guessed.includes(ch) ? ch : "_"))
          .join(" ");

      const outcome = () => {
        const wrong = wrongLetters().length;
        if ([...state.word].every((ch) => state.guessed.includes(ch))) {
          return "won";
        }
        if (wrong >= MAX_WRONG) return "lost";
        return "playing";
      };

      LETTERS.split("").forEach((ch) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = ch;
        btn.dataset.letter = ch;
        keys.append(btn);
      });

      const render = () => {
        const over = outcome();
        const wrong = wrongLetters();
        wordEl.textContent = over === "lost" ? state.word : masked();

        gallows.querySelectorAll(".part").forEach((el) => {
          el.classList.toggle("on", wrong.length >= Number(el.dataset.need));
        });

        [...keys.querySelectorAll("button")].forEach((btn) => {
          const ch = btn.dataset.letter;
          const used = state.guessed.includes(ch);
          btn.disabled = used || over !== "playing";
          btn.classList.toggle("hit", used && state.word.includes(ch));
          btn.classList.toggle("miss", used && !state.word.includes(ch));
        });

        if (over === "won") statusEl.textContent = "You won";
        else if (over === "lost") statusEl.textContent = `You lost — ${state.word}`;
        else statusEl.textContent = `${MAX_WRONG - wrong.length} miss(es) left`;
      };

      const guess = (ch) => {
        const letter = ch.toUpperCase();
        if (!LETTERS.includes(letter)) return;
        if (outcome() !== "playing") return;
        if (state.guessed.includes(letter)) return;
        state.guessed = [...state.guessed, letter];
        render();
      };

      keys.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-letter]");
        if (!btn || !keys.contains(btn)) return;
        guess(btn.dataset.letter);
      });

      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        guess(e.key);
      });

      document.getElementById("reset").addEventListener("click", () => {
        state = emptyState(state.word);
        render();
      });

      render();
    </script>
  </body>
</html>
