<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drill 8 — Promises</title>
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .card {
      min-height: 6rem;
      padding: 0.75rem;
      border: 1px solid #333;
    }

    .card.error {
      border-color: #b00;
    }
  </style>
</head>

<body>
  <main>
    <h1>Team load</h1>
    <p>
      <button type="button" id="loadSettled">Load all (allSettled)</button>
      <button type="button" id="loadAll">Load all (all)</button>
    </p>
    <p id="status" aria-live="polite"></p>
    <div id="board" class="board"></div>
  </main>
  <script>
    const IDS = [1, 2, 3];

    /**
     * Fake network. Resolves to { id, name } or rejects.
     * ~40% failure, 300–900ms delay. Do not edit this function.
     */
    function getUser(id) {
      const ms = 300 + Math.floor(Math.random() * 600);
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (Math.random() < 0.4) {
            reject(new Error(`Failed to load user ${id}`));
            return;
          }
          resolve({ id, name: `User ${id}` });
        }, ms);
      });
    }

    const board = document.getElementById("board");
    const statusEl = document.getElementById("status");

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const retry = async (fn, attempts) => {
      try {
        return await fn();
      } catch (e) {
        if (attempts <= 0) throw e;
        await wait(300);
        return retry(fn, attempts - 1);
      }
    };

    const showLoading = () => {
      statusEl.textContent = "Loading…";
      const cards = IDS.map((id) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = String(id);
        card.textContent = "Loading…";
        return card;
      });
      board.replaceChildren(...cards);
    };

    const paintFulfilled = (card, user) => {
      card.classList.remove("error");
      card.replaceChildren();
      card.textContent = user.name;
    };

    const paintRejected = (card, error, id) => {
      card.classList.add("error");
      card.replaceChildren();
      const msg = document.createElement("p");
      msg.textContent = error.message;
      const retryBtn = document.createElement("button");
      retryBtn.type = "button";
      retryBtn.dataset.retryId = String(id);
      retryBtn.textContent = "Retry";
      card.append(msg, retryBtn);
    };

    const renderSettled = (results) => {
      const cards = results.map((result, i) => {
        const id = IDS[i];
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = String(id);
        if (result.status === "fulfilled") {
          paintFulfilled(card, result.value);
        } else {
          paintRejected(card, result.reason, id);
        }
        return card;
      });
      board.replaceChildren(...cards);
    };

    document.getElementById("loadSettled").addEventListener("click", async () => {
      showLoading();
      // First load is getUser only. retry() is for the Retry button.
      const results = await Promise.allSettled(IDS.map((id) => getUser(id)));
      const failed = results.filter((r) => r.status === "rejected").length;
      statusEl.textContent =
        failed === 0 ? "All loaded" : `${failed} failed — use Retry on a card`;
      renderSettled(results);
    });

    document.getElementById("loadAll").addEventListener("click", async () => {
      showLoading();
      try {
        const users = await Promise.all(IDS.map((id) => getUser(id)));
        statusEl.textContent = "All loaded";
        renderSettled(
          users.map((value) => ({ status: "fulfilled", value })),
        );
      } catch (e) {
        statusEl.textContent = e.message;
        const card = document.createElement("div");
        card.className = "card error";
        card.textContent = e.message;
        board.replaceChildren(card);
      }
    });

    board.addEventListener("click", async (e) => {
      const button = e.target.closest("[data-retry-id]");
      if (!button || !board.contains(button)) return;
      const id = Number(button.dataset.retryId);
      const card = button.closest(".card");
      card.classList.remove("error");
      card.textContent = "Loading…";
      try {
        const user = await retry(() => getUser(id), 3);
        paintFulfilled(card, user);
      } catch (err) {
        paintRejected(card, err, id);
      }
      const remaining = board.querySelectorAll("[data-retry-id]").length;
      statusEl.textContent =
        remaining === 0 ? "All loaded" : `${remaining} failed — use Retry on a card`;
    });
