<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drill 2 — paginated fetch</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <p id="status" aria-live="polite">Idle</p>
      <ul id="list"></ul>
      <button type="button" id="prev" disabled>Previous</button>
      <button type="button" id="next">Next</button>
    </main>
    <script>
      /**
       * Fetch https://jsonplaceholder.typicode.com/todos?_page=N&_limit=20
       * Render titles. Status: loading / error / empty / "page P".
       * Disable Next when a short page comes back. Check response.ok.
       * Use textContent, not innerHTML.
       */
      let page = 1;
      const statusText = document.getElementById("status");
      const prevButton = document.getElementById("prev");
      const nextButton = document.getElementById("next");
      const list = document.getElementById("list");

      const loadTodo = async () => {
        statusText.textContent = "Loading...";
        try {
          // Must await. Without it, `res` is a Promise, `res.ok` is undefined,
          // and you fall into the error branch with a still-pending request.
          const res = await fetch(
            `https://jsonplaceholder.typicode.com/todos?_page=${page}&_limit=20`,
          );

          if (!res.ok) {
            // Use statusText, not `status`. `window.status` is a reserved browser
            // string (the old status bar). `status.textContent = ...` throws, the
            // async function dies, and the UI stays on "Loading...".
            statusText.textContent = "Could not load";
            return;
          }

          const items = await res.json();
          if (items.length === 0) {
            list.replaceChildren();
            statusText.textContent = "No todos";
            nextButton.disabled = true;
            prevButton.disabled = page === 1;
            return;
          }

          const ulContent = items.map((item) => {
            const li = document.createElement("li");
            li.textContent = item.title;
            return li;
          });
          list.replaceChildren(...ulContent);

          statusText.textContent = `Page ${page}`;
          // The property is `disabled`, not `disable`. A silent no-op otherwise.
          nextButton.disabled = items.length < 20;
          prevButton.disabled = page === 1;
        } catch (err) {
          // Network failure rejects; HTTP 404 does not. Both must be handled.
          statusText.textContent = "Could not load";
        }
      };

      nextButton.addEventListener("click", () => {
        page+=1;
        loadTodo();
      });

      prevButton.addEventListener("click", () => {
        if (page === 1) return;
        page--;
        loadTodo();
      });
      loadTodo();
      
    </script>
  </body>
</html>
